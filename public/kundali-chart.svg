<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <rect x="10" y="10" width="380" height="380" stroke="#F48C06" stroke-width="2" fill="#FFFDF9" fill-opacity="0.9"/>
  <!-- Diagonals -->
  <line x1="10" y1="10" x2="390" y2="390" stroke="#F48C06" stroke-width="1.8"/>
  <line x1="390" y1="10" x2="10" y2="390" stroke="#F48C06" stroke-width="1.8"/>
  <!-- Inner Diamond -->
  <polygon points="200,10 390,200 200,390 10,200" stroke="#F48C06" stroke-width="2" fill="none"/>
  
  <!-- Subtle House Numbering Stylized -->
  <g fill="#2F327D" font-family="sans-serif" font-size="12" font-weight="bold" opacity="0.6" text-anchor="middle">
    <text x="200" y="110">1 (Lagna)</text>
    <text x="110" y="60">2 (Dhana)</text>
    <text x="60" y="110">3 (Sahaja)</text>
    <text x="110" y="205">4 (Sukha)</text>
    <text x="60" y="295">5 (Putra)</text>
    <text x="110" y="350">6 (Ari)</text>
    <text x="200" y="300">7 (Jaya)</text>
    <text x="290" y="350">8 (Randhra)</text>
    <text x="340" y="295">9 (Bhagya)</text>
    <text x="290" y="205">10 (Karma)</text>
    <text x="340" y="110">11 (Labha)</text>
    <text x="290" y="60">12 (Vyaya)</text>
  </g>

  <!-- Planetary Glyphs in warm orange -->
  <g fill="#E85D04" font-family="serif" font-size="13" font-weight="bold" text-anchor="middle">
    <text x="200" y="135">☉ Surya • ♃ Guru</text>
    <text x="110" y="225">☽ Chandra</text>
    <text x="290" y="225">♀ Shukra • ☿ Budh</text>
    <text x="200" y="325">♂ Mangal</text>
  </g>
</svg>
